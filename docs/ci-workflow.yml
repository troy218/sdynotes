# 브랜치에 push 할 때마다 전체 테스트를 돌린다.
# 같은 리포에서 열리는 PR 은 브랜치 push 가 대표하므로 push 트리거 하나로 충분하다.
#
# ★ 활성화 방법 — 이 파일을 .github/workflows/ci.yml 로 옮기면 된다.
#   mkdir -p .github/workflows && git mv docs/ci-workflow.yml .github/workflows/ci.yml && git commit
#   (이 샌드박스의 GitHub App 토큰에는 workflows 권한이 없어 직접 push 하지 못했다)
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Node 의존성 설치
        run: npm ci

      # requirements.txt 의 고정 버전이 실제로 풀리는지 검증하는 효과도 있다.
      - name: worker 파이썬 의존성 설치
        run: python -m pip install -r worker/requirements.txt

      - name: worker 파이썬 문법 검사
        run: python -m compileall -q worker

      - name: 버전 5곳 동기화 검사
        run: node scripts/bump-version.mjs --check

      # 알려진 깨진 그룹(scripts/run-all-tests.mjs 의 KNOWN_FAILS)은
      # 회귀와 구별되도록 요약에만 표시하고 실패로 세지 않는다.
      # 새로 깨지는 그룹이 생기면 러너가 실패(1)로 끝낸다.
      - name: 전체 테스트
        run: npm test
