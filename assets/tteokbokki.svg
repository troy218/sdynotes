<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 118" width="132" height="118" role="img" aria-label="떡볶이">
  <!-- SDYnotes · 엽스코드 환영 일러스트 — 고추 이모지(🌶️) 대신 쓰는 떡볶이 SVG
       (sdynotes.html #ypEmpty 에 같은 그림을 인라인으로 넣어 둔다) -->
  <defs>
    <linearGradient id="tkBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5668"/>
      <stop offset=".55" stop-color="#343c4b"/>
      <stop offset="1" stop-color="#232935"/>
    </linearGradient>
    <linearGradient id="tkSauce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4f3c"/>
      <stop offset="1" stop-color="#c2281e"/>
    </linearGradient>
    <linearGradient id="tkSauceFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d93a2a"/>
      <stop offset="1" stop-color="#a91f16"/>
    </linearGradient>
    <linearGradient id="tkRice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f0dcba"/>
    </linearGradient>
  </defs>

  <!-- 김 — 느긋하게 피어오른다 -->
  <g fill="none" stroke="#9aa4b5" stroke-width="3.4" stroke-linecap="round">
    <path d="M47 36c-3.4-4.6 3.4-7.4.4-12.6" opacity=".45">
      <animate attributeName="opacity" values=".12;.5;.12" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M66 32c-3.6-5 3.6-8 .2-13.6" opacity=".5">
      <animate attributeName="opacity" values=".16;.55;.16" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M85 36c-3.4-4.6 3.4-7.4.4-12.6" opacity=".45">
      <animate attributeName="opacity" values=".12;.5;.12" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 떡 — 국물에 박힌 하얀 가래떡 -->
  <g stroke="#e6cfa4" stroke-width="1.2">
    <rect x="39" y="30" width="16" height="40" rx="8" fill="url(#tkRice)" transform="rotate(-16 47 50)"/>
    <rect x="58" y="26" width="17" height="46" rx="8.5" fill="url(#tkRice)" transform="rotate(3 66.5 49)"/>
    <rect x="78" y="32" width="16" height="38" rx="8" fill="url(#tkRice)" transform="rotate(15 86 51)"/>
  </g>
  <!-- 떡 끝에 밝은 반전 -->
  <ellipse cx="44.6" cy="33.8" rx="2.6" ry="4" fill="#ffffff" opacity=".75" transform="rotate(-16 44.6 33.8)"/>
  <ellipse cx="65.7" cy="29.4" rx="2.8" ry="4.4" fill="#ffffff" opacity=".8" transform="rotate(3 65.7 29.4)"/>
  <ellipse cx="87.9" cy="36" rx="2.6" ry="4" fill="#ffffff" opacity=".75" transform="rotate(15 87.9 36)"/>

  <!-- 뚝배기 -->
  <path d="M20 64 C20 88 39 101 66 101 C93 101 112 88 112 64 Z" fill="url(#tkBowl)"/>
  <!-- 뚝배기 옆 광택 -->
  <path d="M27 72 C30 86 42 95 56 97" fill="none" stroke="#5d6880" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>
  <!-- 국물(뒤쪽) -->
  <ellipse cx="66" cy="63.5" rx="46" ry="12" fill="#565f72"/>
  <ellipse cx="66" cy="63.5" rx="41.5" ry="9.6" fill="#1d222d"/>
  <ellipse cx="66" cy="63.5" rx="39" ry="8.6" fill="url(#tkSauce)"/>
  <!-- 국물(앞쪽) — 떡이 잠기는 깊이 -->
  <path d="M27 63.5 A39 8.6 0 0 0 105 63.5 A39 12.4 0 0 1 27 63.5 Z" fill="url(#tkSauceFront)"/>
  <path d="M34 67 A34 6.4 0 0 0 98 67" fill="none" stroke="#f26b52" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- 어묵 한 조각 — 국물 위에 -->
  <g transform="rotate(-8 55 66)">
    <rect x="42" y="61.5" width="26" height="9" rx="4.5" fill="#f4d9a8" stroke="#d9b97e" stroke-width="1.2"/>
    <path d="M46 66h18" stroke="#d9b97e" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- 국물 위 고명 -->
  <g>
    <ellipse cx="76" cy="67.5" rx="3.1" ry="1.9" fill="#79c877" transform="rotate(18 76 67.5)"/>
    <ellipse cx="76" cy="67.1" rx="1.4" ry=".8" fill="#4c9a4f" transform="rotate(18 76 67.1)"/>
    <ellipse cx="92" cy="65.5" rx="2.7" ry="1.6" fill="#86d183" transform="rotate(-14 92 65.5)"/>
  </g>
  <g fill="#fff9ec">
    <ellipse cx="66" cy="66.8" rx="1.5" ry=".9" transform="rotate(-24 66 66.8)"/>
    <ellipse cx="72.5" cy="68.4" rx="1.5" ry=".9" transform="rotate(30 72.5 68.4)"/>
    <ellipse cx="38" cy="65.2" rx="1.4" ry=".8" transform="rotate(12 38 65.2)"/>
    <ellipse cx="89" cy="67.2" rx="1.4" ry=".8" transform="rotate(-18 89 67.2)"/>
  </g>

  <!-- 바닥 그림자 -->
  <ellipse cx="66" cy="105" rx="42" ry="6.5" fill="#0a0d14" opacity=".28"/>
</svg>
